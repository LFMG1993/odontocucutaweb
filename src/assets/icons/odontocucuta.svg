<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 170" width="100%" height="100%">
    <title>Logo ODONTO Cúcuta</title>
    
    <defs>
        <style>
            .odonto {
                font-family: 'Arial Black', 'Impact', 'Montserrat', sans-serif;
                font-weight: 900;
                font-size: 52px;
                fill: #1A3178;
                letter-spacing: -1px;
            }
            .cucuta {
                font-family: 'Century Gothic', 'Tw Cen MT', 'Futura', 'Montserrat', sans-serif;
                font-weight: 300;
                font-size: 52px;
                fill: #3281C5;
                letter-spacing: -0.5px;
            }
            .slogan {
                font-family: 'Century Gothic', 'Tw Cen MT', 'Futura', 'Montserrat', sans-serif;
                font-weight: 400;
                font-size: 15px;
                fill: #3281C5;
                letter-spacing: 0.3px;
            }
            .red-path {
                fill: none;
                stroke: #E31B23;
                stroke-width: 3.5;
                stroke-linecap: round;
            }
            .red-dot {
                fill: #E31B23;
            }
        </style>
    </defs>

    <g transform="translate(10, 10)">
        <!-- Texto Principal -->
        <text x="50" y="90">
            <tspan class="odonto">ODONTO</tspan>
            <tspan class="cucuta" dx="8">Cúcuta</tspan>
        </text>
        
        <!-- Eslogan -->
        <text x="53" y="115" class="slogan">Asistencia Odontológica Completa</text>

        <!-- Curva Izquierda -->
        <circle cx="23" cy="65" r="5.5" class="red-dot" />
        <path class="red-path" d="M 23 65 C 25 15, 140 0, 240 40" />

        <!-- Curva Derecha -->
        <circle cx="475" cy="82" r="5.5" class="red-dot" />
        <path class="red-path" d="M 475 82 C 475 155, 270 165, 110 128" />
    </g>
</svg>